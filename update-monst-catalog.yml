name: MONST MASTER character monitoring and publish

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '23 0,3,6,9,12,15,18,21 * * *'

concurrency:
  group: monst-catalog-monitor-and-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  monitor_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Scan newest and rotating older characters
        run: python scripts/update_catalog.py --pages 2 --profiles 5 --delay 3.0
      - name: Publish refreshed catalog and scan cursor to Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/latest.json catalog/monitor_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Monitor MONST MASTER character catalog"
            git pull --rebase
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload latest app and catalog
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy latest catalog to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
